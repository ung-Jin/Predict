<!DOCTYPE html>
<html class="detail-page" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>상세 데이터 - 전력사용량 예측</title>

  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/detail-charts.css}">
  <link rel="stylesheet" th:href="@{/css/detail.css}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>




</head>
<body>
<div class="app">
  <aside th:replace="~{layout/sidebar :: sidebar('detail')}"></aside>

  <div class="main">
    <header th:replace="~{layout/header :: header}"></header>

    <div class="content detail-content">
      <!-- 상단: 기간/지역 드롭다운 + CSV 버튼 -->
      <div th:replace="~{fragments/detail_filter :: detail_filter}"></div>

      <!-- 좌(표) + 우(차트 3종)의 가로 배치 -->
      <div class="detail-body">
        <div th:replace="~{fragments/detail_table :: detail_table}"></div>
        <div th:replace="~{fragments/detail_charts :: detail_charts}"></div>
      </div>
    </div>
  </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<!-- 도넛: 파이 조각 위 % 숫자 플러그인 -> 공용 도넛 그리기(donut.js) 순서로 로드해야 함 -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script th:src="@{/js/donut.js}"></script>
<script th:src="@{/js/detail-charts.js}"></script>
<script th:src="@{/js/detail.js}"></script>
<!-- 도넛 가운데 글자를 짧은 시도명(부산, 전남)으로 쓰려고 시도명 표(SIDO_CODE_TO_SHORT)를 불러옴 -->
<script th:src="@{/js/sido-map-codes.js}"></script>
<script th:src="@{/js/detail-donut.js}"></script>
</body>
</html>
