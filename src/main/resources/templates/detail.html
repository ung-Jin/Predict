<!DOCTYPE html>
<!-- [4번 소유] 상세 데이터 페이지. 사이드바와 헤더는 1번이 만든 조각을 그대로 씁니다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>상세 데이터 - 전력사용량 예측</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">   <!-- 1번 (수정 금지) -->
  <link rel="stylesheet" th:href="@{/css/detail-charts.css}"> <!-- 1번 추가-->
  <link rel="stylesheet" th:href="@{/css/detail.css}">   <!-- 4번 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>   <!-- 1번 추가: 서버 요청용 -->
</head>
<body>
<div class="app">
  <aside th:replace="~{layout/sidebar :: sidebar('detail')}"></aside>     <!-- 1번 -->
  <div class="main">
    <header th:replace="~{layout/header :: header}"></header>              <!-- 1번 -->
    
    <div class="content detail-content">

      <div th:replace="~{fragments/detail_filter :: detail_filter}"></div>  <!-- 4번: 지역 드롭다운 -->
      <!-- 1번 추가: 표(왼쪽) + 차트(오른쪽) 가로 배치. 병합할 때 4번이 조정 -->
      <div class="detail-body">
        <div th:replace="~{fragments/detail_table :: detail_table}"></div>    <!-- 4번: 지역별 표 -->
        <div th:replace="~{fragments/detail_charts :: detail_charts}"></div>  <!-- 1번 대신 작업: 우측 차트 3종 -->
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/detail-charts.js}"></script>   <!-- 1번 추가 -->
</body>
</html>
