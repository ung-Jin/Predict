<!-- ============================================================================
     fragments/chips.html
     ============================================================================
     원래는 [1번 소유]로 정해진 조각인데, 지도 클릭값이랑 바로 이어져야 해서
     일단 2번이 작업함. 1번이 디자인/위치를 자유롭게 바꿔도 전혀 무해합니다.

     역할: 지도에서 고른 비교 지역 2개(A, B)를 얇은 인풋 2개로 그대로 보여주기만
           하는 조각. 값을 직접 계산하지 않음 - 그냥 표시만 함.

     동작 방식:
       - map-app.js가 지역을 고를 때마다(첫 클릭=A, 두 번째 클릭=B, 그 다음부턴 밀기)
         'region:selected' 라는 커스텀 이벤트를 document에 쏨.
       - 이 조각의 /js/chip.js가 그 이벤트만 듣고 있다가 인풋 값을 채워줌.
       - 컨트롤러도, URL 파싱도 필요 없음 - 같은 화면 안 자바스크립트끼리의 대화라서.

     인풋을 readonly로 둔 이유: 값은 지도 클릭으로만 채워지는 게 맞고, 사용자가
     아무 문자열이나 직접 타이핑하면(예: 오타난 지역명) 나중에 상세 데이터 페이지에서
     그 값으로 조회할 때 매칭이 안 될 수 있음.

     ⚠ <script>는 반드시 이 div(th:fragment="chips") "안쪽"에 있어야 함!
       th:replace는 th:fragment가 걸린 엘리먼트 자체만 가져오기 때문에, 예전처럼
       </div> 바깥에 <script>를 두면 그 스크립트는 아예 최종 페이지에 안 실려서
       chip.js가 로드조차 안 됨 (지도를 눌러도 인풋에 아무 반응 없던 원인이 이거였음).
       donut.html도 같은 이유로 <script>를 fragment div 안쪽에 둠 - 그 관례를 따름.
     ============================================================================ -->
<div th:fragment="chips" class="card chips">
  <div class="chip-row">
    <span class="chip-label">지역비교</span>
    <input type="text" id="chipA" class="chip-input" placeholder="지도에서 지역을 선택하세요" readonly>
    <input type="text" id="chipB" class="chip-input" placeholder="두 번째 지역 (선택)" readonly>
  </div>

  <script th:src="@{/js/chip.js}"></script>
</div>
