<!--
  [4번 소유] 상단 필터 바.
  구조는 비워 두고 detail.js 가 드롭다운 열고/닫기, 칩 그리기, CSV 다운로드 바인딩을 한다.
  (DOM만 선언형으로 두고 상태는 자바스크립트가 쥐는 패턴 — 테스트와 재조립이 쉬움)
-->
<div th:fragment="detail_filter" class="card detail-filter">

  <!-- 왼쪽: 기간 + 지역 -->
  <div class="df-left">
    <label class="df-label">기간</label>
    <!-- 데이터 기간은 고정이라 버튼처럼 보이기만 함 (실제 피커 없음) -->
    <button type="button" class="df-chip df-chip-static" disabled>
      2022.01 ~ 2026.07
      <span class="df-caret">▾</span>
    </button>

    <label class="df-label">지역</label>
    <!-- 클릭하면 지역 드롭다운이 열림. 내부의 chips는 detail.js가 상태에 맞춰 그린다. -->
    <button type="button" class="df-regions" id="dfRegionTrigger" aria-haspopup="listbox">
      <span class="df-chips" id="dfSelectedChips">
        <!-- JS가 선택된 지역 수에 따라 채움:
             0개 → "전국 (지역을 선택하세요)" (회색 플레이스홀더)
             1개 → chip A + "+ 비교 지역 추가"
             2개 → chip A + chip B -->
      </span>
      <span class="df-caret">▾</span>
    </button>
  </div>

  <!-- 오른쪽: CSV 내보내기 -->
  <div class="df-right">
    <button type="button" class="df-csv" id="dfCsvBtn">⤓ CSV 내보내기</button>
  </div>

  <!--
    지역 선택 모달 (평소엔 hidden). detail.js가 열고 닫는다.
    - 전체 17개 시도 체크박스 (가나다 정렬)
    - 상단 검색창으로 필터
    - 하단 "선택 해제" 버튼으로 전체 해제
    - 체크는 최대 2개 (3번째를 체크하면 "먼저 고른 지역"이 빠지고 들어옴)
  -->
  <div class="df-modal" id="dfRegionModal" hidden>
    <div class="df-modal-back" data-modal-close></div>
    <div class="df-modal-panel" role="dialog" aria-label="지역 선택">
      <div class="df-modal-search">
        <span class="df-modal-search-ico">⌕</span>
        <input type="text" id="dfRegionSearch" placeholder="시도 검색"
               autocomplete="off" spellcheck="false">
      </div>
      <ul class="df-modal-list" id="dfRegionList" role="listbox" aria-multiselectable="true">
        <!-- JS가 시도 17개로 채움 -->
      </ul>
      <div class="df-modal-foot">
        <span>최대 2개 · 3번째를 고르면 먼저 고른 지역이 바뀝니다</span>
        <button type="button" id="dfRegionClear">선택 해제</button>
      </div>
    </div>
  </div>
</div>
