<!--
  [1번 작성 ] 상세 데이터 우측 차트 영역 (뼈대)

  - 선택 지역은 sessionStorage(selectedRegionA/B)에서 읽음 -> static/js/detail-charts.js 참고
-->

<div th:fragment="detail_charts" class="detail-charts">

  <!-- 1) 연도별 월평균 사용량 (막대) -->
  <div class="card detail-chart-card">
    <div class="detail-chart-title">연도별 월평균 사용량
      <span class="detail-chart-sub">GWh · 마지막 연도는 일부 달만 평균</span>
    </div>
    <div class="detail-chart-body"><canvas id="detailBarChart"></canvas></div>
  </div>

  <!-- 2) 계절 패턴 (선) -->
  <div class="card detail-chart-card">
    <div class="detail-chart-title">계절 패턴
      <span class="detail-chart-sub">월 사용량 ÷ 연평균 × 100</span>
    </div>
    <div class="detail-chart-body"><canvas id="detailSeasonChart"></canvas></div>
  </div>

  <!-- 3) 기간별 사용량 (히트맵). 산점도의 점을 네모로 그려서 만듦. 이름과 아래 문구는 JS가 채움 -->
  <div class="card detail-chart-card detail-chart-heat">
    <div class="detail-chart-title">기간별 사용량
      <span class="detail-chart-sub">GWh · 진할수록 사용량이 많음</span>
    </div>
    <div class="detail-chart-body">
      <!-- 1번 줄 -->
      <div class="detail-heat-block" id="detailHeatBlock1">
        <div class="detail-heat-name"><span class="detail-heat-dot" id="detailHeatDot1"></span><span id="detailHeatName1"></span></div>
        <div class="detail-heat-box"><canvas id="detailHeatChart1"></canvas></div>
        <div class="detail-heat-foot" id="detailHeatFoot1"></div>
      </div>
      <!-- 2번 줄 (선택 0개일 때는 JS가 숨김) -->
      <div class="detail-heat-block" id="detailHeatBlock2">
        <div class="detail-heat-name"><span class="detail-heat-dot" id="detailHeatDot2"></span><span id="detailHeatName2"></span></div>
        <div class="detail-heat-box"><canvas id="detailHeatChart2"></canvas></div>
        <div class="detail-heat-foot" id="detailHeatFoot2"></div>
      </div>
    </div>
  </div>

</div>
