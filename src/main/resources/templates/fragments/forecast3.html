<!-- [3번 소유] 앞으로 3개월 예측 (지도에서 지역을 고르면 js/dashboard.js 가 이 카드를 켠다) -->
<div th:fragment="forecast3" class="card forecast3">

  <div class="forecast3-head">
    <p class="forecast3-title">앞으로 3개월 예측</p>
    <p class="forecast3-sub">GWh · 얇은 막대는 작년</p>
  </div>

  <!-- 차트 영역. 높이는 forecast3.css 가 고정한다 -->
  <div class="forecast3-chart">
    <canvas id="forecast3Chart"></canvas>
  </div>

  <!-- 달 별 전년 동월 대비 증감률. forecast3.js 가 채운다 -->
  <div class="forecast3-caption" id="forecast3Caption"></div>

  <!-- script 는 반드시 이 fragment div "안쪽"에 둬야 최종 페이지에 실린다 -->
  <script th:src="@{/js/forecast3.js}"></script>

</div>
