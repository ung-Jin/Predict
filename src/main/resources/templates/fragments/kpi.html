<!-- [3번 소유] 요약 카드 4개 -->
<!-- 값은 static/js/kpi.js 가 /chart-api/card 에서 받아 채운다.
     지도 선택이 바뀌면 줄이 1개(전국) <-> 2개(지역+비교군)로 늘고 준다. -->
<div th:fragment="kpi" class="kpi">

  <div class="card kpi-card" id="kpiRecent">
    <p class="kpi-label">최근 실측</p>
    <div class="kpi-rows"></div>
  </div>

  <div class="card kpi-card" id="kpiPredicted">
    <p class="kpi-label">예측 사용량</p>
    <div class="kpi-rows"></div>
  </div>

  <div class="card kpi-card" id="kpiYoy">
    <p class="kpi-label">전년 동월 대비</p>
    <div class="kpi-rows"></div>
  </div>

  <div class="card kpi-card" id="kpiMape">
    <p class="kpi-label">검증 오차 (MAPE)</p>
    <div class="kpi-rows"></div>
  </div>

  <!-- script 는 반드시 이 fragment div "안쪽"에 둬야 최종 페이지에 실린다 (chips.html, donut.html 과 같은 관례).
       dashboard.html 은 1번 소유라, 필요한 것을 조각이 직접 불러온다.
       세 조각이 같은 파일을 불러도 브라우저가 캐시하고, kpi-common.js 는 다시 실행돼도 안전하다.
       chart.js 는 dashboard.html 에 원래부터 있다. -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  <script th:src="@{/js/kpi-common.js}"></script>
  <script th:src="@{/js/kpi.js}"></script>

</div>
