spring:
  application:
    name: Predict
  #데이터베이스 연결 정보
  datasource:
    driverClassName: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:mariadb://localhost:3306/study_db
    username: study_user
    password: mariadb
  # [2026-10-06] 개발 중 정적 리소스 캐시 비활성화.
  # 이게 없으면 /static/ 아래 js/css가 브라우저에 캐시돼서, 소스를 바꿔도 하드리프레시
  # 하지 않으면 반영이 안 됨. 운영 배포 전엔 이 블록을 지우거나 period를 늘려야 함.
  web:
    resources:
      cache:
        period: 0
      chain:
        cache: false
  # [2026-10-06] Thymeleaf 템플릿 캐시도 끔 (html 조각 수정이 바로 반영되게)
  thymeleaf:
    cache: false

#쿼리문이 있는 mapper 파일 위치 지정, classpath는 resources 폴더를 의미함
mybatis:
  mapper-locations: classpath:mapper/*.xml

#session에 데이터 저장 후 웹 브라우저가 cookie 활성화 되어 있음을 인지
server:
  servlet:
    session:
      tracking-modes: cookie
